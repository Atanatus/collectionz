<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACCRETION</title>
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<header><a class="brand" href="#inicio">ACCRETION</a></header>
<div class="site-layout">
  <div class="site-sidebar">
    <nav aria-label="Secciones">
      <a href="#inicio">Inicio</a>
      <a href="#duelo">Duelos</a>
      <a href="#tienda">Tienda</a>
      <a href="#mercado">Mercado</a>
      <a class="nav-guide" href="#ayuda">Guía</a>
    </nav>
    <footer class="site-footer">© ACCRETION</footer>
  </div>
  <aside class="player-panel" aria-label="Perfil y colección">
    <div class="player-account">
      <a class="panel-link" href="#perfil">Perfil <small>Jugador local</small></a>
      <a class="panel-link" href="#perfil/mis-sobres">Mis sobres <small>Sobres de prueba</small></a>
    </div>
    <a class="panel-link" href="#albumes">Álbumes</a>
    <a class="panel-link" href="#perfil/mazo">Mazos</a>
  </aside>
  <main id="contenido"></main>
</div>
<dialog id="detalle-carta" aria-labelledby="detalle-nombre">
  <h2 id="detalle-nombre"></h2>
  <p id="detalle-datos"></p>
  <img id="detalle-imagen" alt="" hidden>
  <form method="dialog"><button>Cerrar</button></form>
</dialog>
<dialog id="duel-wave" aria-labelledby="duel-wave-title">
  <h2 id="duel-wave-title">Eco de la oleada</h2>
  <ol id="duel-wave-cards"></ol>
  <form method="dialog">
    <button value="keep" autofocus>Mantener orden</button>
    <button value="swap">Intercambiar las cartas</button>
  </form>
</dialog>
<dialog id="duel-discard" aria-labelledby="duel-discard-title">
  <h2 id="duel-discard-title"></h2>
  <ul id="duel-discard-cards"></ul>
  <form method="dialog"><button autofocus>Cerrar</button></form>
</dialog>
<dialog id="duel-result" aria-labelledby="duel-result-title">
  <h2 id="duel-result-title"></h2>
  <p id="duel-result-turn"></p>
  <p id="duel-result-move"></p>
  <a class="cta" href="#duelo/preparar">Preparar otra partida →</a>
  <form method="dialog"><button autofocus>Ver tablero final</button></form>
</dialog>
<script src="assets/js/catalogo.js" defer></script>
<script src="assets/js/sobres.js" defer></script>
<script src="assets/js/mazos.js" defer></script>
<script src="assets/js/duelo.js" defer></script>
<script src="assets/js/site.js" defer></script>
</body>
</html>
