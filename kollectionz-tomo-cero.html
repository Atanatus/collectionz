<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KollectionZ · Maqueta</title>
<style>
:root { color-scheme: light; --ink: #170c31; --paper: #fff9ff; --red: #c21b64; --violet: #e5caff; --line: 2px solid var(--ink); }
* { box-sizing: border-box; }
body { margin: 0; background: radial-gradient(#170c3124 1px, transparent 1px) 0 0 / 7px 7px, #eaddff; color: var(--ink); font: 1rem/1.5 'Barlow', system-ui, sans-serif; }
header, nav, main { padding-inline: max(1rem, calc((100% - 72rem)/2)); }
header { text-align: center; background: radial-gradient(ellipse at 50% 145%, #732add, transparent 72%), var(--ink); color: var(--paper); padding-block: 1rem; border-top: 5px solid var(--red); }
.brand { display: inline-block; color: inherit; text-decoration: none; font: italic 950 clamp(2.1rem,6vw,3.5rem)/1 'Archivo Black', system-ui, sans-serif; letter-spacing: -.075em; text-shadow: 3px 3px var(--red); }
.brand-ja { display: block; color: #ffc7ee; font-size: .72rem; letter-spacing: .28em; margin-top: .55rem; }
nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .55rem; background: var(--paper); border-bottom: var(--line); padding-block: .6rem; }
nav a, button { font: inherit; font-weight: 800; color: inherit; background: var(--paper); border: var(--line); padding: .55rem; text-align: center; text-decoration: none; cursor: pointer; }
nav a { text-transform: uppercase; }
nav a[aria-current] { background: var(--red); color: white; box-shadow: 3px 3px var(--ink); }
nav a:hover, button:not(:disabled):hover { outline: 2px solid var(--red); outline-offset: 2px; }
:focus-visible { outline: 3px solid #5120a4; outline-offset: 3px; }
button:disabled { opacity: .5; cursor: default; }
main { padding-block: 1.35rem 2rem; }
h1, h2 { margin: 0 0 .65rem; font-weight: 900; line-height: 1.1; }
main > h1 { font-size: clamp(1.65rem,4vw,2.5rem); border-left: .45rem solid var(--red); padding-left: .65rem; text-transform: uppercase; }
p { margin: .5rem 0; }
article, aside, .page, .product { border: var(--line); background: var(--paper); padding: 1rem; box-shadow: 4px 4px var(--ink); }
article + article { margin-top: 1rem; }
.hero + article { border-top: 5px solid var(--red); }
.hero { display: grid; grid-template-columns: 1fr 1.1fr; align-items: center; isolation: isolate; position: relative; overflow: hidden; padding: clamp(1rem, 4vw, 2.7rem); gap: .5rem; background: linear-gradient(112deg, #fff09d 3%, #ffd24c 49%, #ff715c 100%); }
.hero::before { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle at 72% 48%, #fff091 0 20%, transparent 20.3%), repeating-conic-gradient(from 3deg at 75% 50%, #6b246c2d 0deg 2deg, transparent 2deg 9deg); }
.hero h2 { font: italic 950 clamp(2.45rem, 6.7vw, 5.3rem)/.93 'Archivo Black', system-ui, sans-serif; letter-spacing: -.075em; }
.hero-ja { font-weight: 800; color: #581c68; letter-spacing: .12em; }
.hero img { width: 100%; height: auto; filter: drop-shadow(0 4px 0 #fff1a3) drop-shadow(0 11px 0 #43186845); }
.cta { display: inline-block; margin-top: .65rem; background: var(--ink); color: white; text-decoration: none; font-weight: 800; padding: .55rem .8rem; box-shadow: 3px 3px var(--red); }
.shelf { display: grid; grid-template-columns: 3fr 1fr; gap: 1rem; }
.selector, .actions { display: flex; align-items: center; justify-content: center; gap: .8rem; }
.cover { width: min(100%, 17rem); aspect-ratio: 4/5; background: repeating-conic-gradient(at 54% 44%, #ffffff29 0deg 3deg, transparent 3deg 12deg), linear-gradient(150deg, #5627b1, #8b29c1 65%, #aa1b71); color: white; font-size: 1.55rem; box-shadow: 5px 5px var(--ink), inset 8px 0 #34117166; }
.book { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: .25rem; margin-block: 1rem; }
.cards { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: .45rem; }
.card { aspect-ratio: 4/5; border: 1px dashed #75558e; display: grid; place-content: center; text-align: center; overflow-wrap: anywhere; background: #f3eaff; }
.owned { background: repeating-conic-gradient(from 25deg, #ffffff30 0deg 7deg, transparent 7deg 21deg), var(--violet); border: var(--line); font-weight: 750; }
.owned img { width: 95%; align-self: center; justify-self: center; }
.page p { text-align: center; }
.page:nth-child(odd) { border-top: 5px solid #8749d6; }
.page:nth-child(even) { border-top: 5px solid var(--red); }
.products { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(14rem,1fr); overflow-x: auto; gap: 1rem; padding: .15rem .4rem .9rem .15rem; }
.art { height: 8rem; display: grid; place-items: center; background: repeating-conic-gradient(#742aa340 0deg 4deg, transparent 4deg 16deg), #f5ccff; margin-bottom: .8rem; }
.art::before { content: 'コレクション'; writing-mode: vertical-rl; display: grid; place-items: center; width: 3.7rem; height: 5.3rem; border: var(--line); border-block-width: .45rem; background: var(--red); color: white; font-size: .7rem; font-weight: 900; transform: rotate(-9deg); }
.art[data-format="sobre"] { background-color: #ffce57; }
.art[data-format="lote"] { background-color: #d2acff; }
.art[data-format="caja"] { background-color: #ff9cd1; }
.art[data-format="lote"]::before { box-shadow: 5px 3px var(--ink), 10px 6px #9b52f0, 14px 8px var(--ink); }
.art[data-format="caja"]::before { writing-mode: horizontal-tb; width: 6rem; height: 4rem; background: #5724a9; box-shadow: 6px -6px #b97aff, 8px -8px var(--ink); transform: skewY(-7deg); }
@media (max-width: 600px) {
  header { padding-top: max(1rem, env(safe-area-inset-top)); }
  nav {
    position: fixed;
    inset: auto 0 0;
    z-index: 1;
    gap: .25rem;
    border-top: var(--line);
    border-bottom: 0;
    padding: .45rem max(.5rem, env(safe-area-inset-right))
      calc(.45rem + env(safe-area-inset-bottom)) max(.5rem, env(safe-area-inset-left));
  }
  nav a { display: grid; place-items: center; min-height: 44px; font-size: clamp(.62rem, 2.8vw, .83rem); padding: .2rem .05rem; }
  nav a[aria-current] { box-shadow: inset 0 -3px var(--ink); }
  main { padding-bottom: calc(5rem + env(safe-area-inset-bottom)); }
  button { min-height: 44px; }
  .selector button[data-album] { min-width: 44px; }
  .cover { min-width: 0; }
  .shelf, .book { grid-template-columns: 1fr; }
  .hero { grid-template-columns: 1fr; }
  .hero img { max-width: 27rem; margin-inline: auto; }
  .products { grid-auto-columns: minmax(0, 82%); scroll-snap-type: x proximity; }
  .product { scroll-snap-align: start; }
}
</style>
</head>

<header><a class="brand" href="#inicio">KollectionZ</a><span class="brand-ja" lang="ja">コレクションゼット</span></header>

</nav>

/*

  tiene seis huecos fijos por página y dos páginas enfrentadas en escritorio.
- Tienda presenta sobres individuales, lotes y cajas en un escaparate horizontal.
- Los sobres adquiridos se gestionan en Perfil → Mis sobres.
- Mercado P2P de cartas individuales con comisión por transacción. La moneda y
  la comisión están pendientes. La carta permanece en el álbum hasta la venta.
- Vender la última copia vacía su hueco. Las copias repetidas no suman progreso.
- Datos, cantidades y precios de tienda pendientes. El verde del boceto era

const main = document.querySelector('#contenido');
const albums = [
  { name: 'Álbum 1', season: 'Temporada 1', total: 200, copies: { 1: 2, 3: 1, 6: 1, 8: 1 } },
  { name: 'Álbum 2', season: 'Temporada 2', total: 48, copies: {} }
];
const sections = ['inicio', 'albumes', 'tienda', 'mercado', 'perfil'];
const singlePage = matchMedia('(max-width: 600px)');
let selectedAlbum = 0;
let page = 0;

function renderPage(album, index) {
  const start = index * 6;
  const length = Math.min(6, album.total - start);
  const cards = Array.from({ length }, (_, offset) => {
    const number = start + offset + 1;
    const copies = album.copies[number] || 0;
    return copies
      ? `<div class="card owned">${album === albums[0] && number === 1 ? `<img src="${muecaArt}" alt="Mueca Radiactivo">` : `Carta ${number}`}${copies > 1 ? `<small>×${copies}</small>` : ''}</div>`
      : `<div class="card" aria-label="Carta ${number} pendiente">#${number}</div>`;
  }).join('');
  return `<section class="page" aria-label="Página ${index + 1}"><div class="cards">${cards}</div><p>Página ${index + 1}</p></section>`;
}

function renderAlbums(view) {
  const album = albums[selectedAlbum];
  if (view !== 'abierto') {
    return `<h1>Álbumes</h1><div class="shelf"><div class="selector">
      <button data-album="-1" aria-label="Álbum anterior" ${selectedAlbum === 0 ? 'disabled' : ''}>←</button>
      <button class="cover" id="open-album">${album.name}<br><small>Abrir álbum</small></button>
      <button data-album="1" aria-label="Álbum siguiente" ${selectedAlbum === albums.length - 1 ? 'disabled' : ''}>→</button>
    </div><aside><h2>${album.name}</h2><p>${album.season}</p><p>Cartas distintas: ${Object.keys(album.copies).length}/${album.total}</p></aside></div>`;
  }
  const step = singlePage.matches ? 1 : 2;
  const totalPages = Math.ceil(album.total / 6);
  const start = Math.floor(page / step) * step;
  const pages = Array.from({ length: Math.min(step, totalPages - start) }, (_, offset) => renderPage(album, start + offset)).join('');
  return `<a href="#albumes">← Volver a Álbumes</a><h1>${album.name}</h1><div class="book">${pages}</div><div class="actions">
    <button data-page="${Math.max(0, start - step)}" ${start === 0 ? 'disabled' : ''}>← Anterior</button>
    <button data-page="${start + step}" ${start + step >= totalPages ? 'disabled' : ''}>Siguiente →</button>
  </div>`;
}

  const [requested, view] = location.hash.slice(1).split('/');
  const section = sections.includes(requested) ? requested : 'inicio';
  for (const link of document.querySelectorAll('nav a')) {
    if (link.hash === '#' + section) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  }

  switch (section) {
    case 'inicio':
      main.innerHTML = `<h1>Últimas novedades</h1>
        <article class="hero"><div><p class="hero-ja" lang="ja">放射能の怪異</p><h2>Mueca<br>Radiactivo</h2>
        <p>Vista previa del primer álbum.</p><a class="cta" href="#albumes">Explorar álbumes →</a></div>
        <img src="${muecaArt}" alt="Mueca Radiactivo, criatura de tinta morada con sonrisa luminosa" width="820" height="539"></article>
        <article><h2>Bienvenido a KollectionZ</h2><p>Aquí publicaremos las novedades de temporadas, cartas y actualizaciones.</p></article>`;
      break;
    case 'albumes':
      main.innerHTML = renderAlbums(view);
      break;
    case 'tienda':
      main.innerHTML = '<h1>Tienda</h1><div class="products" aria-label="Formatos de sobres" tabindex="0">' +
        [['Sobre individual', 'sobre', '1 sobre'], ['Lote de sobres', 'lote', 'Cantidad por definir'], ['Caja', 'caja', 'Cantidad por definir']].map(([name, art, units]) =>
          `<section class="product"><div class="art" data-format="${art}" aria-hidden="true"></div><h2>${name}</h2><p>Álbum 1 · ${units}</p><p>Precio por definir</p><button disabled>Comprar</button></section>`).join('') + '</div>';
      break;
    case 'mercado':
      main.innerHTML = '<h1>Mercado</h1><p>Compraventa de cartas individuales entre jugadores. Próximamente.</p>';
      break;
    case 'perfil':
      main.innerHTML = view === 'mis-sobres'
        ? '<a href="#perfil">← Volver a Perfil</a><h1>Mis sobres</h1><p>No tienes sobres pendientes en esta maqueta.</p><a href="#tienda">Ir a la tienda</a>'
        : '<h1>Perfil</h1><article><h2>Mis sobres</h2><p>Consulta aquí los sobres pendientes de abrir.</p><a href="#perfil/mis-sobres">Ver mis sobres</a></article>';
      break;
  }
}

main.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button || button.disabled) return;
  if (button.id === 'open-album') {
    page = 0;
    location.hash = 'albumes/abierto';
  } else if (button.dataset.album !== undefined) {
    selectedAlbum += Number(button.dataset.album);
    render();
    main.querySelector(`button[data-album="${button.dataset.album}"]:not(:disabled), #open-album`)?.focus();
  } else if (button.dataset.page !== undefined) {
    const previousPage = page;
    page = Number(button.dataset.page);
    render();
    const controls = [...main.querySelectorAll('button[data-page]:not(:disabled)')];
    const sameDirection = controls.find(control => Math.sign(Number(control.dataset.page) - page) === Math.sign(page - previousPage));
    (sameDirection || controls[0])?.focus({ preventScroll: true });
    main.querySelector('.book').scrollIntoView({ block: 'nearest' });
  }
});
addEventListener('hashchange', render);
singlePage.addEventListener('change', render);
render();
</script>
</body>
</html>
